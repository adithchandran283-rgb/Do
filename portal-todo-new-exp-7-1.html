<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2A33"><title>Do</title>
<style>
:root{
  --bg:#E8EFF1; --surface:#FFFFFF; --ink:#0E2A33; --muted:#566F7A; --line:#CBD9DE;
  --panel:#0E2A33; --panel-ink:#F2F7F8; --panel-muted:#9DB6BF; --ring:#FFB020; --ring-track:rgba(255,255,255,.13);
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --over:#FF6B57; --micro:#14966F; --fill-track:#DCE7EB;
  --card:var(--surface); --mute:var(--muted); --acc:var(--accent); --acc2:color-mix(in srgb,var(--accent) 14%,transparent);
  --red:var(--over); --amb:#E39A00; --grn:var(--micro); --low:#3b82f6; --blue:var(--accent);
  --font-display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.8,.3,1);
  --g-fill:linear-gradient(145deg,rgba(255,255,255,.80),rgba(255,255,255,.46));
  --g-line:rgba(255,255,255,.78); --g-hi:rgba(255,255,255,.95); --g-shadow:rgba(14,42,51,.12);
  --g-input:rgba(255,255,255,.55); --g-chip:rgba(255,255,255,.4);
  --g-blob1:rgba(47,107,255,.24);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#08161B; --surface:#112630; --ink:#E7F0F2; --muted:#8FA8B2; --line:#1F3944;
    --panel:#0F2C37; --accent:#5B8CFF; --micro:#2DC194; --fill-track:#1B3440; --amb:#F0B34A;
    --g-fill:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    --g-line:rgba(255,255,255,.13); --g-hi:rgba(255,255,255,.16); --g-shadow:rgba(0,0,0,.40);
    --g-input:rgba(255,255,255,.06); --g-chip:rgba(255,255,255,.05); --g-blob1:rgba(91,140,255,.22);
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow-anchor:none;scrollbar-gutter:stable}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--g-blob1),transparent 38%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a,.t,label{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
:focus:not(:focus-visible){outline:none}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none;display:grid;gap:8px}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:16px 18px 130px;min-height:100dvh}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.when h1{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.when p{color:var(--muted);font-size:.85rem}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--g-line);background:var(--g-fill);box-shadow:0 2px 6px -3px var(--g-shadow),inset 0 1px 0 var(--g-hi);display:grid;place-items:center;font-size:1.4rem;line-height:1;color:var(--ink);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}

/* Hero */
.hero{background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.17),transparent 58%),linear-gradient(160deg,rgba(34,78,94,.94),rgba(10,34,43,.97));color:var(--panel-ink);border-radius:32px;padding:26px 22px 20px;text-align:center;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 0 0 1px rgba(255,255,255,.08),0 6px 14px -8px rgba(14,42,51,.5);animation:cardrise .46s var(--ease) both}
.ring-wrap{position:relative;width:min(220px,66vw);aspect-ratio:1;margin:0 auto}
.ring{width:100%;height:100%;display:block}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:14}
.ring .arc{fill:none;stroke:var(--ring);stroke-width:14;stroke-linecap:round;stroke-dasharray:590.62;stroke-dashoffset:590.62;transform:rotate(-90deg);transform-origin:110px 110px;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring.full .arc{stroke:#35D6C0}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,14vw,3.4rem);line-height:1;letter-spacing:-.03em}
.big .of{font-size:.55em;color:var(--panel-muted);font-weight:600;letter-spacing:0}
.ring-center .small{color:var(--panel-muted);font-size:.9rem;margin-top:4px}
.left{margin-top:14px;font-family:var(--font-display);font-weight:600;font-size:1.1rem}
.pop{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--font-display);font-weight:700;font-size:1.6rem;color:var(--ring);pointer-events:none;animation:rise .95s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.1)}}
.ring-wrap.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.hero.pomo{padding:20px 22px 14px}
.ph{font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--panel-muted);text-align:center;margin:0 0 4px}

/* Add bar */
.add{background:var(--g-fill);border:1px solid var(--g-line);border-radius:22px;padding:10px;box-shadow:0 4px 10px -6px var(--g-shadow),inset 0 1px 0 var(--g-hi)}
.add .r{display:flex;gap:8px}
#q{flex:1;border:0;background:none;outline:0;font-size:1.05rem;padding:8px 6px;min-width:0}
#go{height:44px;padding:0 18px;border-radius:14px;font-weight:700;color:var(--accent-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.14),0 5px 12px -6px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
#go:active{transform:scale(.94)}
#opts{display:none;flex-wrap:wrap;gap:6px;padding:8px 2px 2px;align-items:center}
.add.open #opts{display:flex;animation:fadein .3s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#opts input[type=date],#opts select{border:1px solid var(--g-line);background:var(--g-chip);border-radius:99px;padding:5px 12px;font-size:.88rem}
.hint{color:var(--muted);font-size:.9rem}

/* Chips */
.chip{flex:none;border:1px solid var(--g-line);background:var(--g-chip);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:.9rem;font-weight:500;transition:background .15s,border-color .15s,transform .15s}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.pj{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.pj::-webkit-scrollbar{display:none}
.pj .chip{white-space:nowrap}

/* Headings */
h2{font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em;margin:22px 2px 10px}
h2.red{color:var(--over)}

/* Task cards */
.t{display:flex;align-items:center;gap:12px;background:var(--g-fill);border:1px solid var(--g-line);border-radius:20px;padding:10px 8px 10px 12px;box-shadow:0 4px 10px -6px var(--g-shadow),inset 0 1px 0 var(--g-hi);overflow:hidden;transition:height .3s ease,opacity .25s ease,padding .3s ease,margin .3s ease,background-color .3s,border-width .3s;cursor:pointer}
.t.enter{animation:slidein .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slidein{0%{opacity:0;transform:translateY(-14px) scale(.97);background:color-mix(in srgb,var(--ring) 35%,transparent)}100%{opacity:1;transform:none}}
.t.leaving{height:0!important;opacity:0;padding-top:0;padding-bottom:0;margin:-4px 0;border-width:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.8rem;color:transparent;transition:background .25s,border-color .25s,color .2s}
.t.done .ck{background:var(--grn);border-color:var(--grn);color:#fff}
.ck.cpop{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
.t.done .ti{text-decoration:line-through;color:var(--muted)}
.t.done{opacity:.8;background:linear-gradient(145deg,color-mix(in srgb,var(--grn) 18%,transparent),color-mix(in srgb,var(--grn) 6%,transparent));border-color:color-mix(in srgb,var(--grn) 40%,var(--g-line))}
.tx{flex:1;min-width:0}
.ti{overflow-wrap:anywhere;font-weight:600}
.me{font-size:.82rem;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.me .od{color:var(--over);font-weight:600}
.pn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;background:var(--acc2);color:var(--accent);font-size:.75rem;font-weight:700;margin-right:8px;vertical-align:1px}
.st{font-size:1.25rem;color:var(--line);padding:6px 8px;transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .2s}
.st:active{transform:scale(1.3)}
.st.on{color:var(--amb)}
.tm{font-size:.85rem;color:var(--muted);padding:6px 10px;border-radius:99px;border:1px solid var(--g-line);background:var(--g-chip);white-space:nowrap;transition:transform .15s}
.tm:active{transform:scale(.93)}
.tm.on{color:var(--accent);border-color:var(--accent);background:var(--acc2);font-weight:600}
.empty{border:1.5px dashed var(--g-line);border-radius:20px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:1.1rem;margin-bottom:4px}

/* Glass cards */
.gcard,.cal,.wk{background:var(--g-fill);border:1px solid var(--g-line);box-shadow:0 4px 10px -6px var(--g-shadow),inset 0 1px 0 var(--g-hi);border-radius:24px;padding:14px}
.wk{margin-bottom:12px}
.cal{padding:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--font-display)}
.ch button{font-size:1.6rem;padding:0 14px;color:var(--muted);transition:transform .15s}
.ch button:active{transform:scale(.88)}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.cd{aspect-ratio:1;border-radius:12px;background:var(--g-chip);border:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;font-size:.9rem;font-weight:600;line-height:1.1;transition:transform .15s,box-shadow .2s}
.cd:active{transform:scale(.92)}
.cd b{font-size:.68rem;font-weight:600;opacity:.92}
.cd.dB,.cd.dG,.cd.dR{color:#fff;border-color:transparent}
.cd.dB{background:var(--blue)}
.cd.dG{background:var(--grn)}
.cd.dR{background:color-mix(in srgb,var(--over) 86%,#000)}
.cd.td{outline:2px solid var(--ink);outline-offset:2px}
.cd.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.pg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.wr{display:flex;align-items:center;gap:14px}
.rg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rg{display:grid;justify-items:center;gap:2px;text-align:center}
.rg svg{width:92px;height:92px}
.rg b{font-size:.85rem}.rg small{color:var(--muted);font-size:.75rem}
.lgd{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
.lgd i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Overview / focus rings */
.ovw{position:relative;width:min(70vw,260px);margin:6px auto 12px}
.ovw svg{width:100%;display:block;overflow:visible}
.sg{fill:none;stroke-width:3;cursor:pointer;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-width .2s,opacity .2s}
.sg.dim{opacity:.3}.sg.sel{stroke-width:4.2}
.ovc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;gap:2px}
.ovc b{font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
.ovc small{color:var(--muted);font-size:.8rem}
.hero .ovc small{color:var(--panel-muted)}
.mt{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.lg{display:grid;gap:8px;margin-top:14px}
.lr{display:flex;align-items:center;gap:10px;background:var(--g-fill);border:1px solid var(--g-line);box-shadow:0 2px 6px -4px var(--g-shadow),inset 0 1px 0 var(--g-hi);border-radius:16px;padding:10px 12px;width:100%;text-align:left;transition:transform .15s}
.lr:active{transform:scale(.98)}
.lr.sel{border-color:var(--ink)}
.lr .dot{width:12px;height:12px;border-radius:50%;flex:none}
.lr span{flex:1}.lr em{font-style:normal;color:var(--muted);font-size:.85rem}
.prg{transition:stroke-dashoffset 1s linear}
.ovmask{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .14s}
.ovw.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1) 1.15s}
/* Add task button + sheet */
.fab{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:8px;height:54px;padding:0 26px;border-radius:99px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--accent-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.14),0 10px 24px -8px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .2s cubic-bezier(.3,1.5,.5,1);animation:fabin .45s var(--ease) both}
.fab:active{transform:translateX(-50%) scale(.94)}
.fab svg{width:20px;height:20px}
@keyframes fabin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}
body.hasfab #toast{bottom:calc(154px + env(safe-area-inset-bottom,0px))}
.sheet .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet .chips input[type=date]{width:auto;flex:1;min-width:150px}
.sheet .chip{height:40px;padding:0 16px}
.num{width:70px;border:1px solid var(--g-line);background:var(--g-input);border-radius:99px;padding:5px 10px;font-size:.9rem;text-align:center}
.psel{width:100%;border:1.5px solid var(--g-line);background:var(--g-input);border-radius:14px;padding:12px;margin-bottom:10px}
.pset{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}

/* Buttons */
.act{display:flex;gap:10px;margin-top:16px}
.act button{flex:1 1 0;height:52px;border-radius:16px;font-weight:700;font-size:1rem;background:var(--g-fill);border:1.5px solid var(--g-line);box-shadow:0 2px 6px -3px var(--g-shadow),inset 0 1px 0 var(--g-hi);transition:transform .15s}
.act button:active{transform:scale(.96)}
.act.col{flex-direction:column}.act.col button{flex:none}
.act .pr{border:0;color:var(--accent-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.14),0 5px 12px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.act .dg{color:var(--over)}

/* Tab bar */
.tabbar{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:480px;z-index:15;display:flex;gap:0;background:color-mix(in srgb,var(--surface) 62%,transparent);border:1px solid var(--g-line);border-radius:99px;padding:6px;-webkit-backdrop-filter:blur(6px) saturate(1.4);backdrop-filter:blur(6px) saturate(1.4);box-shadow:0 10px 28px -10px rgba(14,42,51,.35),inset 0 1px 0 var(--g-hi),inset 0 0 0 1px rgba(255,255,255,.06);transform:translateZ(0)}
.tabbar .hl{position:absolute;left:0;top:6px;height:calc(100% - 12px);width:0;border-radius:99px;pointer-events:none;will-change:transform;transition:transform .5s var(--ease);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 1px 0 var(--g-hi)}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:.62rem;font-weight:600;border-radius:99px;transition:color .2s,transform .18s var(--ease);position:relative;z-index:1;user-select:none;-webkit-user-select:none;white-space:nowrap}
.tabbar button svg{width:23px;height:23px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tabbar button.on{color:var(--accent)}
.tabbar button:active{transform:scale(.94)}
.tabbar button.on svg{transform:translateY(-2px) scale(1.12)}

/* Entrance */
.rise{animation:cardrise .46s var(--ease) both;backface-visibility:hidden}
@keyframes cardrise{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;visibility:hidden;z-index:16;display:flex;align-items:center;gap:6px;max-width:min(92vw,420px);background:color-mix(in srgb,var(--ink) 80%,transparent);color:var(--surface);border-radius:16px;padding:6px 6px 6px 16px;font-weight:500;font-size:.95rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px -8px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.2);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.2),visibility 0s .35s}
#toast.show{opacity:1;transform:translate(-50%,0);visibility:visible;transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.2),visibility 0s}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{flex:none;color:var(--ring);font-weight:700;font-size:.95rem;padding:10px 14px;border-radius:12px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(15,20,42,0);visibility:hidden;transition:background-color .34s ease,visibility 0s .46s;z-index:20}
.scrim.open{background:rgba(15,20,42,.33);visibility:visible;transition:background-color .3s ease,visibility 0s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:30;visibility:hidden;transform:translate3d(0,100%,0);transition:transform .38s cubic-bezier(.22,1,.36,1),visibility 0s .38s;will-change:transform;backface-visibility:hidden;background:color-mix(in srgb,var(--surface) 8%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);box-shadow:inset 0 1px 0 var(--g-hi);color:var(--ink)}
.sheet.open{visibility:visible;transform:translate3d(0,0,0);transition:transform .38s cubic-bezier(.22,1,.36,1),visibility 0s}
.grab{width:42px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 22%,transparent);margin:0 auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h2{font-size:1.3rem;margin:0 0 12px}
.sheet-close{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--g-line);background:var(--g-fill);box-shadow:0 2px 6px -3px var(--g-shadow),inset 0 1px 0 var(--g-hi);color:var(--ink);display:grid;place-items:center}
.sheet label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px;font-weight:500}
.sheet input:not([type=checkbox]):not([type=file]),.sheet select{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--g-line);background:var(--g-input);padding:0 12px;font-size:1rem;box-shadow:inset 0 1px 2px var(--g-shadow)}
.sheet input:focus,.sheet select:focus{border-color:var(--accent);outline:none}
.sb{display:flex;align-items:center;gap:10px;padding:4px 0}
.sb input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.sb span{flex:1;overflow-wrap:anywhere}.sb span.dn{text-decoration:line-through;color:var(--muted)}
.sb button{color:var(--muted);padding:4px 8px}

<script>
/* drag the handle area down to dismiss a sheet */
(function(){
  var scrim=document.getElementById('scrim');
  document.querySelectorAll('.sheet').forEach(function(sh){
    var y0=null,dy=0,t0=0,dragRaf=0;
    sh.addEventListener('touchstart',function(e){
      var t=e.touches[0];
      if(t.clientY-sh.getBoundingClientRect().top>60||e.target.closest('input,select,textarea,button'))return;
      y0=t.clientY;dy=0;t0=Date.now();
      sh.style.setProperty('transition','none','important');
    },{passive:true});
    sh.addEventListener('touchmove',function(e){
      if(y0==null)return;
      dy=Math.max(0,e.touches[0].clientY-y0);
      if(!dragRaf)dragRaf=requestAnimationFrame(function(){
        dragRaf=0;
        if(y0!=null)sh.style.setProperty('transform','translate3d(0,'+dy+'px,0)','important');
      });
    },{passive:true});
    function end(){
      if(y0==null)return;
      var v=dy/Math.max(1,Date.now()-t0),close=dy>110||v>.6;
      y0=null;
      if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=0}
      sh.style.removeProperty('transition');sh.style.removeProperty('transform');
      if(close&&scrim)scrim.click();
    }
    sh.addEventListener('touchend',end,{passive:true});
    sh.addEventListener('touchcancel',end,{passive:true});
  });
})();
</script>
